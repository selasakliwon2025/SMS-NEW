<header class="topbar">
  <button type="button" class="mobile-menu-button" id="mobileMenuButton"
          aria-label="Buka menu" aria-expanded="false">☰</button>

  <div class="brand-logos">
    <img id="logoDanantara" alt="Danantara Indonesia">
    <span class="logo-divider"></span>
    <img id="logoASDP" alt="ASDP Indonesia">
    <span class="logo-divider"></span>
    <img id="logoJN" alt="PT Jembatan Nusantara">
  </div>

  <input class="search-box" type="text"
         placeholder="⌕  Cari kapal, jadwal, atau dokumen..."
         aria-label="Pencarian">

  <div class="profile-area">
    <div class="profile-avatar" id="profileAvatar">M</div>
    <div class="profile-details">
      <strong id="profileName">Memuat...</strong>
      <small id="profileRole">ADMIN</small>
    </div>
    <button type="button" class="logout-button" id="topLogout">Keluar</button>
  </div>
</header>
