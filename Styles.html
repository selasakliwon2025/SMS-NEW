<style>
    :root {
      --navy: #062c55;
      --navy-dark: #041f3d;
      --blue: #087bd1;
      --blue-light: #eaf5fd;
      --background: #edf5fb;
      --text: #173b61;
      --muted: #7890a8;
      --line: #dbe8f3;
      --green: #16a579;
      --orange: #f59b35;
      --red: #ef4d4d;
      --white: #ffffff;
      --sidebar-width: 255px;
      --sidebar-collapsed-width: 82px;
      --transition: 0.25s ease;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--background);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid #7dd3fc;
      outline-offset: 3px;
    }

    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 1000;
      width: var(--sidebar-width);
      flex: 0 0 var(--sidebar-width);
      display: flex;
      flex-direction: column;
      padding: 22px 16px;
      color: var(--white);
      background: linear-gradient(
        180deg,
        #062c55 0%,
        #075b8e 70%,
        #087bd1 100%
      );
      overflow-y: auto;
      transition:
        width var(--transition),
        transform var(--transition);
    }

    .sidebar-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 0 2px 22px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
    }

    .sidebar-brand {
      min-width: 0;
      flex: 1;
      align-items: center;
      gap: 10px;
    }

    .sidebar-brand-mark {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      display: grid;
      place-items: center;
      border: 2px solid #ffffff;
      border-radius: 50%;
      font-size: 18px;
      font-weight: 800;
    }

    .sidebar-brand-text {
      min-width: 0;
    }

    .sidebar-brand-text strong {
      display: block;
      font-size: 12px;
      line-height: 1.4;
      letter-spacing: 0.7px;
      white-space: nowrap;
    }

    .sidebar-brand-text small {
      display: block;
      margin-top: 4px;
      color: #c9e5f9;
      font-size: 9px;
      white-space: nowrap;
    }

    .sidebar-toggle {
      width: 40px;
      height: 40px;
      position: relative;
      z-index: 5;
      flex: 0 0 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 24px;
      line-height: 1;
    }

    .sidebar-toggle:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .sidebar-menu {
      flex: 1;
    }

    .menu-title {
      margin: 28px 12px 10px;
      color: #b7d7ef;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 4px 0;
      padding: 13px 12px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: #ffffff;
      text-align: left;
      font-size: 12px;
      transition: background var(--transition);
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .nav-item.active {
      background: #1688e0;
      box-shadow: 0 8px 18px rgba(0, 28, 59, 0.15);
    }

    .nav-icon {
      width: 18px;
      flex: 0 0 18px;
      text-align: center;
      font-size: 15px;
    }

    .sidebar-status {
      margin-top: 24px;
      padding: 13px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 10px;
      line-height: 1.8;
    }

    .sidebar-status strong {
      display: block;
      font-size: 11px;
    }

    /* =========================
       MAIN AREA
    ========================= */

    .main {
      min-width: 0;
      width: calc(100% - var(--sidebar-width));
      margin-left: var(--sidebar-width);
      transition:
        margin-left var(--transition),
        width var(--transition);
    }

    .topbar {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 28px;
      background: var(--white);
      border-bottom: 1px solid var(--line);
    }

    .mobile-menu-button {
      display: none;
      width: 38px;
      height: 38px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--white);
      color: var(--navy);
      font-size: 23px;
    }

    .brand-logos {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-logos img {
      display: block;
      width: auto;
      height: 36px;
      max-width: 180px;
      object-fit: contain;
    }

    #logoDanantara {
      max-width: 155px;
    }

    #logoASDP {
      max-width: 90px;
    }

    #logoJN {
      max-width: 185px;
    }

    .logo-divider {
      width: 1px;
      height: 30px;
      flex: 0 0 1px;
      background: #cbd8e5;
    }

    .search-box {
      width: min(390px, 35vw);
      padding: 11px 16px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: #ffffff;
      color: var(--muted);
      font-size: 11px;
    }

    .profile-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-avatar {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--navy);
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
    }

    .profile-details strong {
      display: block;
      color: var(--navy);
      font-size: 12px;
    }

    .profile-details small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
    }

    .logout-button {
      padding: 10px 15px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #ffffff;
      color: var(--text);
      font-size: 11px;
    }

    .logout-button:hover {
      background: #f3f8fc;
    }

    .content {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      padding: 28px;
    }

    /* =========================================
      HERO / BANNER
    ========================================= */

    .hero {
        position: relative;
        overflow: hidden;
        min-height: 155px;
        padding: 24px 28px;
        border-radius: 18px;
        color: #ffffff;

        background:
            linear-gradient(
                90deg,
                rgba(4, 48, 91, 0.96) 0%,
                rgba(5, 83, 139, 0.78) 48%,
                rgba(5, 111, 174, 0.42) 100%
            ),
            linear-gradient(135deg, #0a477c, #087bd1);

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    .hero-content {
        position: relative;
        z-index: 2;
        padding-right: 230px;
    }

    .hero h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.35;
    }

    .hero p {
        max-width: 500px;
        margin: 10px 0 0;
        font-size: 12px;
        line-height: 1.7;
        color: #dcefff;
    }

    /* Tanggal dan jam di desktop */
    .hero-date {
        position: absolute;
        top: 20px;
        right: 24px;
        z-index: 3;

        width: 180px;
        padding: 12px 15px;
        border-radius: 10px;

        background: #ffffff;
        color: var(--text);
        font-size: 10px;
        line-height: 1.6;
    }

    .hero-date strong {
        display: block;
        margin-bottom: 5px;
        font-size: 11px;
    }

    .hero-date span {
        display: block;
        font-size: 10px;
        color: var(--muted);
    }

    /* =========================================
      HERO MOBILE
    ========================================= */

    @media (max-width: 768px) {

        .hero {
            min-height: 330px;
            padding: 28px 26px;
        }

        .hero-content {
            padding-right: 0;
        }

        .hero h1 {
            max-width: 100%;
            font-size: 25px;
            line-height: 1.35;
        }

        .hero p {
            max-width: 100%;
            font-size: 12px;
            line-height: 1.7;
        }

        .hero-date {
            top: auto;
            right: 26px;
            bottom: 24px;
            left: 26px;

            width: auto;
            padding: 13px 15px;
        }

        .hero-date strong {
            font-size: 11px;
        }

        .hero-date span {
            font-size: 10px;
        }
    }

    /* =========================
       SECTION AND CARDS
    ========================= */

    .section-title {
      margin: 28px 0 15px;
      color: var(--navy);
      font-size: 19px;
      font-weight: 800;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 15px;
    }

    .stat-card {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #ffffff;
    }

    .stat-card label {
      color: var(--muted);
      font-size: 11px;
    }

    .stat-card strong {
      display: block;
      margin: 10px 0 4px;
      color: var(--navy);
      font-size: 31px;
      line-height: 1;
    }

    .stat-card small {
      color: var(--muted);
      font-size: 10px;
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: var(--blue-light);
      color: var(--blue);
      font-size: 23px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.05fr 1fr 0.95fr;
      gap: 15px;
      margin-top: 15px;
    }

    .panel {
      min-width: 0;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #ffffff;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .panel-header h3 {
      margin: 0;
      color: var(--navy);
      font-size: 14px;
    }

    .panel-link {
      border: 0;
      background: transparent;
      color: var(--blue);
      font-size: 10px;
      font-weight: 800;
    }

    /* =========================
       DONUT CHART
    ========================= */

    .donut-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    .donut {
      width: 155px;
      height: 155px;
      flex: 0 0 155px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        conic-gradient(
          var(--green) 0 67%,
          var(--orange) 67% 92%,
          var(--red) 92% 100%
        );
    }

    .donut::after {
      content: "12\A Total Kapal";
      width: 98px;
      height: 98px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #ffffff;
      color: var(--navy);
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      white-space: pre;
    }

    .legend {
      color: var(--text);
      font-size: 11px;
      line-height: 2.4;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      flex: 0 0 9px;
      border-radius: 50%;
    }

    .legend-dot.green {
      background: var(--green);
    }

    .legend-dot.orange {
      background: var(--orange);
    }

    .legend-dot.red {
      background: var(--red);
    }

    /* =========================
       BAR CHART
    ========================= */

    .bar-chart {
      height: 180px;
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      gap: 18px;
      padding: 0 12px;
      border-bottom: 1px solid var(--line);
    }

    .bar-group {
      height: 100%;
      display: flex;
      align-items: flex-end;
      gap: 5px;
    }

    .bar {
      width: 21px;
      border-radius: 5px 5px 0 0;
      background: var(--blue);
    }

    .bar.green {
      background: var(--green);
    }

    .bar.orange {
      background: var(--orange);
    }

    .month-labels {
      display: flex;
      justify-content: space-around;
      margin-top: 10px;
      color: var(--muted);
      font-size: 10px;
    }

    /* =========================
       ALERTS
    ========================= */

    .alert-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #edf3f8;
    }

    .alert-item:last-child {
      border-bottom: 0;
    }

    .alert-icon {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      border-radius: 50%;
      background: var(--red);
    }

    .alert-icon.orange {
      background: linear-gradient(135deg, #ffad4d, #ef4d4d);
    }

    .alert-content {
      min-width: 0;
      flex: 1;
    }

    .alert-content strong {
      display: block;
      color: var(--navy);
      font-size: 11px;
    }

    .alert-content small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
    }

    .alert-badge {
      padding: 7px 9px;
      border-radius: 999px;
      background: #ffebee;
      color: #c53645;
      font-size: 9px;
      font-weight: 800;
      white-space: nowrap;
    }

    .alert-badge.orange {
      background: #fff1d8;
      color: #a96b0b;
    }

    /* =========================
       TABLE
    ========================= */

    .table-panel {
      margin-top: 15px;
    }

    .table-scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 650px;
      border-collapse: collapse;
      font-size: 11px;
    }

    th {
      padding: 12px;
      background: #f7fbfe;
      color: var(--muted);
      text-align: left;
      font-weight: 700;
    }

    td {
      padding: 13px 12px;
      border-bottom: 1px solid #edf3f8;
    }

    td strong {
      color: var(--navy);
    }

    .status-pill {
      display: inline-block;
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 9px;
      font-weight: 800;
    }

    .status-pill.green {
      background: #e6f8f0;
      color: #07815b;
    }

    .status-pill.orange {
      background: #fff1d8;
      color: #a96b0b;
    }

    .status-pill.red {
      background: #ffebee;
      color: #c53645;
    }

    .progress-track {
      width: 95px;
      height: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: #e7f0f6;
    }

    .progress-track span {
      display: block;
      height: 100%;
      border-radius: 99px;
      background: var(--green);
    }

    /* =========================
       OVERLAY
    ========================= */

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(2, 23, 40, 0.45);
    }

    /* =========================
       SIDEBAR COLLAPSED DESKTOP
    ========================= */

    body.sidebar-collapsed .sidebar {
      width: var(--sidebar-collapsed-width);
      flex-basis: var(--sidebar-collapsed-width);
    }

    body.sidebar-collapsed .main {
      width: calc(100% - var(--sidebar-collapsed-width));
      margin-left: var(--sidebar-collapsed-width);
    }

    body.sidebar-collapsed .sidebar-brand-text,
    body.sidebar-collapsed .menu-title,
    body.sidebar-collapsed .sidebar-status {
      display: none;
    }

    body.sidebar-collapsed .sidebar-header {
      justify-content: center;
    }

    body.sidebar-collapsed .nav-item {
      justify-content: center;
      padding-left: 0;
      padding-right: 0;
    }

    body.sidebar-collapsed .nav-label {
      display: none;
    }

    /* =========================
       TABLET
    ========================= */

    @media (max-width: 1200px) {
      .stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .dashboard-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .dashboard-grid .panel:last-child {
        grid-column: 1 / -1;
      }

      .search-box {
        display: none;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 768px) {
      .sidebar {
        width: 280px;
        max-width: 85vw;
        flex-basis: 280px;
        transform: translateX(-100%);
        box-shadow: 8px 0 28px rgba(0, 0, 0, 0.18);
      }

      .sidebar-header {
        align-items: center;
      }

      .sidebar-toggle {
          width: 38px;
          height: 38px;
          flex: 0 0 38px;
      }

      body.sidebar-open .sidebar {
        transform: translateX(0);
      }

      body.sidebar-collapsed .sidebar {
        width: 280px;
        flex-basis: 280px;
      }

      body.sidebar-collapsed .sidebar-brand-text,
      body.sidebar-collapsed .menu-title,
      body.sidebar-collapsed .sidebar-status,
      body.sidebar-collapsed .nav-label {
        display: block;
      }

      body.sidebar-collapsed .nav-item {
        justify-content: flex-start;
        padding-left: 12px;
        padding-right: 12px;
      }

      .main,
      body.sidebar-collapsed .main {
        width: 100%;
        margin-left: 0;
      }

      .topbar {
        min-height: 68px;
        padding: 0 14px;
        gap: 10px;
      }

      .mobile-menu-button {
        display: inline-flex;
      }

      .brand-logos {
        flex: 1;
        justify-content: center;
        gap: 7px;
      }

      .brand-logos img {
        height: 27px;
        max-width: 95px;
      }

      #logoDanantara {
        max-width: 100px;
      }

      #logoASDP {
        max-width: 62px;
      }

      #logoJN {
        max-width: 100px;
      }

      .logo-divider {
        height: 24px;
      }

      .profile-details {
        display: none;
      }

      .logout-button {
        padding: 9px 10px;
      }

      .content {
        padding: 15px;
      }

      .hero {
        min-height: 245px;
        padding: 24px 20px;
      }

      .hero h1 {
        max-width: 270px;
        font-size: 23px;
      }

      .hero p {
        max-width: 290px;
        font-size: 11px;
      }

      .hero-date {
        top: auto;
        right: 20px;
        bottom: 20px;
        left: 20px;
        min-width: auto;
      }

      .section-title {
        font-size: 17px;
      }

      .stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .stat-card {
        padding: 15px;
      }

      .stat-card strong {
        font-size: 27px;
      }

      .stat-icon {
        width: 38px;
        height: 38px;
        flex-basis: 38px;
        font-size: 19px;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .dashboard-grid .panel:last-child {
        grid-column: auto;
      }

      .panel {
        padding: 16px;
      }

      .donut-area {
        gap: 15px;
      }

      .donut {
        width: 135px;
        height: 135px;
        flex-basis: 135px;
      }

      .donut::after {
        width: 86px;
        height: 86px;
      }

      .bar-chart {
        height: 155px;
      }

      .sidebar-overlay {
        display: none;
      }

      body.sidebar-open .sidebar-overlay {
        display: block;
      }
    }

    @media (max-width: 430px) {
      .brand-logos img {
        height: 24px;
      }

      #logoDanantara {
        max-width: 86px;
      }

      #logoASDP {
        max-width: 52px;
      }

      #logoJN {
        max-width: 85px;
      }

      .profile-avatar {
        width: 34px;
        height: 34px;
      }

      .hero h1 {
        font-size: 21px;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .donut-area {
        flex-direction: column;
      }
    }
  </style>
